# Publishes the website version to GitHub Pages on every push to main:
#   https://alacastd.github.io/Book-Dragon-Liar/
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Publish website

on:
  push:
    branches: [main]
  pull_request: # builds (but doesn't publish) to check the website still compiles
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the website
        run: npm run build:web
        env:
          CI: 1
          # Pages serves this repo's site from /<repo name>/.
          WEB_BASE_URL: /${{ github.event.repository.name }}

      # Pages has no "single-page app" setting: serving index.html as the
      # 404 page makes links like /book/12 open the app instead of an error.
      - name: Prepare for GitHub Pages
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
