# Publishes the website version to GitHub Pages on every push to main:
#   https://alacastd.github.io/Book-Dragon-Lair/
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Publish website

on:
  push:
    branches: [main]
  pull_request: # builds (but doesn't publish) to check the website still compiles
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Pages serves the site from /<repo name>/. Look the name up now (by the
      # repo's permanent ID) rather than using the name saved with the push, so
      # re-running an old run after renaming the repo still builds for the
      # right address.
      - name: Find the site address
        id: site
        run: |
          name=$(gh api "repositories/${{ github.repository_id }}" --jq .name)
          echo "Building for /$name/"
          echo "base=/$name" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build the website
        run: npm run build:web
        env:
          CI: 1
          WEB_BASE_URL: ${{ steps.site.outputs.base }}

      - name: Check the build points at that address
        run: grep -q 'src="${{ steps.site.outputs.base }}/_expo/' dist/index.html

      # Pages has no "single-page app" setting: serving index.html as the
      # 404 page makes links like /book/12 open the app instead of an error.
      - name: Prepare for GitHub Pages
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
