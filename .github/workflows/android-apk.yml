# Builds an installable Android app (APK) on every push to main.
# Download it from the run's page: Actions tab → latest run → "Artifacts" → book-inventory-apk.
name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # adds a "Run workflow" button in the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Check code (types, lint, tests)
        run: |
          npm run typecheck
          npm run lint
          npm test -- --ci

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      # Reuses downloaded and compiled build files between runs, so later builds are much faster.
      - uses: gradle/actions/setup-gradle@v4

      # Builds only for arm64 phones (every Android phone from roughly 2017 on).
      # Compiling for all four processor types took over 30 minutes.
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a

      - uses: actions/upload-artifact@v4
        with:
          name: book-inventory-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
