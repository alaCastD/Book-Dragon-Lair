<svg xmlns="http://www.w3.org/2000/svg" width="240" height="120" viewBox="0 0 240 120">
  <!-- Option A: a bookshelf. One shelf of spines; tiles stack into a full bookcase. -->
  <rect width="240" height="120" fill="#9CAF88"/>
  <g stroke="#7E946B" stroke-width="1" stroke-opacity="0.55">
    <rect x="6"   y="34" width="14" height="78" rx="1.5" fill="#93A77F"/>
    <rect x="22"  y="22" width="18" height="90" rx="1.5" fill="#A6B893"/>
    <rect x="42"  y="40" width="11" height="72" rx="1.5" fill="#8FA37B"/>
    <rect x="55"  y="28" width="20" height="84" rx="1.5" fill="#A2B48F"/>
    <rect x="77"  y="46" width="13" height="66" rx="1.5" fill="#96AA82"/>
    <rect x="92"  y="30" width="16" height="82" rx="1.5" fill="#A9BA97"/>
    <!-- a leaning book -->
    <rect x="112" y="36" width="15" height="76" rx="1.5" fill="#8FA37B" transform="rotate(-12 112 112)"/>
    <rect x="140" y="24" width="19" height="88" rx="1.5" fill="#A4B691"/>
    <rect x="161" y="38" width="12" height="74" rx="1.5" fill="#93A77F"/>
    <rect x="175" y="32" width="17" height="80" rx="1.5" fill="#A8B995"/>
    <!-- a small stack lying flat -->
    <rect x="198" y="100" width="36" height="12" rx="1.5" fill="#94A880"/>
    <rect x="201" y="89"  width="30" height="11" rx="1.5" fill="#A5B792"/>
  </g>
  <!-- spine bands -->
  <g stroke="#7E946B" stroke-width="1.4" stroke-opacity="0.45">
    <path d="M22 34h18M22 100h18M55 40h20M55 98h20M92 42h16M92 100h16M140 36h19M140 100h19M175 44h17M175 100h17"/>
  </g>
  <!-- shelf plank -->
  <rect x="0" y="112" width="240" height="8" fill="#869B73"/>
  <rect x="0" y="112" width="240" height="1.5" fill="#B4C4A3" fill-opacity="0.6"/>
</svg>
